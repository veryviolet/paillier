[package]
name = "paillier"
version = "0.3.0"
edition = "2021"
# Лицензия ИСХОДНИКОВ крейта. Собранное колесо шире: в него статически
# входит GMP под LGPL-3.0+, и `pyproject.toml` объявляет это отдельно.
# Разбор — `NOTICE.md`.
license = "MIT OR Apache-2.0"
description = "Аддитивно-гомоморфное шифрование Paillier: реализация на Rust поверх GMP с привязкой к Python"
readme = "README.md"
repository = "https://github.com/veryviolet/paillier"
homepage = "https://veryviolet.github.io/paillier/"
keywords = ["paillier", "homomorphic", "encryption", "cryptography", "gmp"]
categories = ["cryptography"]
authors = ["Kirill Groshenkov <kir.groshenkov@gmail.com>"]
# Версия здесь ЕДИНСТВЕННАЯ. `pyproject.toml` объявляет её `dynamic`, и
# maturin берёт её отсюда: две копии номера разъезжаются молча, а
# разъехавшаяся версия хуже отсутствующей — она врёт про то, какой код
# установлен.
exclude = ["/benches", "/docs", "/.github", "/mkdocs.yml", "/site"]

[lib]
name = "paillier"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
# Бэкенд `rug` выбран не по вкусу. Бэкенд `num-bigint`, включённый в
# крейте по умолчанию, тянет `glass_pumpkin`, а тот — `core2`, у
# которого ВСЕ версии отозваны в апреле 2026: крейт был полифилом для
# `core::error::Error`, стабилизированного в Rust 1.81, и надобность
# отпала. С `backend-rug` этой цепочки нет вовсе, и он же считает на
# GMP.
rug = "1.24"
rand = "0.8"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true

[[bench]]
name = "modmul"
harness = false

[[bench]]
name = "secure_pow"
harness = false

[[bench]]
name = "window_select"
harness = false

[[bench]]
name = "exponent_length"
harness = false

[dev-dependencies]
# ТОЛЬКО эталон для тестов: своя реализация, сверяемая сама с собой,
# ничего не доказывает. В сборку библиотеки НЕ входит.
fast-paillier = { version = "=0.3.2", default-features = false, features = ["backend-rug"] }

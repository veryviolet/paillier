[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
# The DISTRIBUTION name. The import name stays `paillier` and is set
# below as `module-name` — PyPI refused `paillier` as a project name,
# and there is no reason to drag that into the API.
name = "pypaillier"
description = "Additively homomorphic Paillier encryption: a Rust implementation on top of GMP, bound to Python through pyo3"
readme = "README.md"
requires-python = ">=3.10"
# The expression describes the WHEEL, not only our own sources.
#
# Our code is MIT OR Apache-2.0. But `rug` and `gmp-mpfr-sys` are
# LGPL-3.0+, and GMP is compiled into the extension STATICALLY: verified
# by the `GNU MP assertion failed` strings inside the `.so` and by `ldd`
# showing no external libgmp at all. So the wheel is a combined work
# under LGPL §4, and declaring it plainly "MIT OR Apache-2.0" would be a
# lie in the package metadata.
#
# The breakdown, and how the §4 conditions are met: `NOTICE.md`.
license = "(MIT OR Apache-2.0) AND LGPL-3.0-or-later"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "LICENSE-LGPL", "LICENSE-GPL", "NOTICE.md"]
authors = [{ name = "Kirill Groshenkov", email = "kir.groshenkov@gmail.com" }]
keywords = [
    "paillier",
    "homomorphic-encryption",
    "cryptography",
    "federated-learning",
    "privacy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The version comes from `Cargo.toml`. That is the single source of the
# number, and the same place `__version__` reads it from at build time
# (`CARGO_PKG_VERSION`).
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/veryviolet/paillier"
Documentation = "https://veryviolet.github.io/paillier/"
Repository = "https://github.com/veryviolet/paillier"
Issues = "https://github.com/veryviolet/paillier/issues"
Changelog = "https://github.com/veryviolet/paillier/blob/main/CHANGELOG.md"

[tool.maturin]
# The import name, deliberately different from the distribution name:
# `pip install pypaillier` then `import paillier`. Without this line
# maturin would name the module after the distribution.
module-name = "paillier"
# Wheels are built PER PYTHON VERSION, without `abi3`.
#
# The temptation of `abi3` is real — one wheel instead of four — but a
# compatibility tag that does not match the contents is worse than no
# tag: an extension tagged `abi3` while using an unstable symbol
# installs fine and dies on import on the first interpreter that dropped
# that symbol. A per-version wheel cannot lie about compatibility: it
# was either built for this interpreter or it does not exist.
features = ["pyo3/extension-module"]
strip = true

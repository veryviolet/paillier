site_name: paillier
site_url: https://veryviolet.github.io/paillier/
site_description: >-
  Additively homomorphic Paillier encryption: a Rust implementation on top of
  GMP, bound to Python through pyo3.
repo_url: https://github.com/veryviolet/paillier
repo_name: veryviolet/paillier

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - .
  - toc:
      permalink: true

nav:
  - Start here:
      - What this is: index.md
      - Installation: getting-started/installation.md
      - First run: getting-started/first-run.md
  - How it works:
      - The scheme and what it assumes: concepts/scheme.md
      - Timing side channels: concepts/timing.md
      - Encoding and scale: concepts/encoding.md
  - Reference:
      - API: reference/api.md
      - Limits and refusals: reference/limits.md
      - Benchmarks: reference/benches.md
  - Analysis:
      - Short-exponent security: short-exponent-security.md
  - Changelog: changelog.md

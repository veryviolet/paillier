name: docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual redeploy

permissions:
  contents: write # gh-deploy commits to the gh-pages branch

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gh-deploy needs the full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install documentation dependencies
        run: pip install -r docs/requirements.txt
      - name: git author for the gh-deploy commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: mkdocs gh-deploy
        # A block scalar rather than a plain string: a colon followed
        # by a space inside an unquoted scalar is read by YAML as a
        # nested mapping. That is exactly why the first run never
        # started.
        run: |
          mkdocs gh-deploy --force --message "docs deployed ${GITHUB_REF_NAME}"

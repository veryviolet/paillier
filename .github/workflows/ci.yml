name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Tests run in release: some of them measure TIME (the slope
      # against exponent weight and against the number of leading
      # zeros), and in a debug build those measurements mean nothing.
      # Safe-prime generation in debug would also take minutes.
      - run: cargo test --release

  python:
    name: pytest on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build and install
        run: |
          python -m pip install --quiet --upgrade pip 'maturin>=1.7,<2' pytest pyyaml
          maturin build --release --out dist --interpreter python
          pip install --quiet dist/*.whl
      - run: pytest -q

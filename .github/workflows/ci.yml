name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Тесты идут в release: часть из них меряет ВРЕМЯ (наклон по весу
      # показателя, по числу ведущих нулей), и в debug-сборке эти замеры
      # не значат ничего. Плюс порождение безопасных простых в debug
      # заняло бы минуты.
      - run: cargo test --release

  python:
    name: pytest на ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: собрать и поставить
        run: |
          python -m pip install --quiet --upgrade pip 'maturin>=1.7,<2' pytest pyyaml
          maturin build --release --out dist --interpreter python
          pip install --quiet dist/*.whl
      - run: pytest -q

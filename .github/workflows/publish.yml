name: publish to PyPI

# Trusted Publishing (OIDC) — no long-lived tokens here or in the
# repository secrets. It requires a ONE-TIME setup on the PyPI side,
# which only the account owner can do:
#
#   pypi.org -> Manage -> Account -> Publishing -> Add a new pending publisher
#     project:     paillier
#     owner:       veryviolet
#     repository:  paillier
#     workflow:    publish.yml
#     environment: pypi
#
# After that, pushing any vX.Y.Z tag builds the wheels and publishes
# them to https://pypi.org/project/paillier/.
#
# Why the wheels are built inside a manylinux container rather than on
# the runner: a local build gets its tag from the machine glibc
# (`manylinux_2_34` here) and installs only where glibc is no older. The
# `2014` container gives `manylinux_2_17` — the floor that installs
# almost everywhere.

on:
  push:
    tags:
      - "v*"
  # The manual trigger is not for convenience. The Trusted Publishing
  # setup on the PyPI side is one-time and done by a human; a tag cut
  # before it can never be published, and inventing an extra version for
  # that would be lying in the release history.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for the OIDC trust exchange

jobs:
  build-wheels:
    name: wheel for ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: check the tag against the version in Cargo.toml
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          tag="${REF_NAME#v}"
          ver="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $tag does not match version $ver in Cargo.toml"
            exit 1
          fi

      - name: build the wheel in manylinux
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --interpreter ${{ matrix.python }}
          manylinux: "2014"

      # A wheel not verified by installing it is not a wheel, it is an
      # archive. Verified on the SAME interpreter it was built for.
      - name: install and run
        run: |
          set -e
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet --upgrade pip pytest
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/python scripts/smoke_wheel.py
          /tmp/check/bin/python -m pytest tests/encryption.py tests/scale.py -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python }}
          path: dist/*.whl

  build-sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: show what is being published
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

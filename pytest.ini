# Файлы тестов здесь называются по предмету (`encryption.py`), а не
# `test_*.py`. Без этой строки `pytest` в корне репозитория собирает
# НОЛЬ тестов и завершается тихо — а запускались они только потому, что
# я всякий раз перечислял их по имени руками.
#
# Пустой сьют — не зелёный сьют. Это тот же класс, что дока со ссылкой
# на несуществующий файл: проверка, которая не выполняется, выглядит
# выполненной.
[pytest]
testpaths = tests
python_files = *.py

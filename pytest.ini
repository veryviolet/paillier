# The test files here are named after their subject (`encryption.py`),
# not `test_*.py`. Without this line, `pytest` at the repository root
# collects ZERO tests and exits quietly — and they only ever ran because
# every file was listed by hand on the command line.
#
# An empty suite is not a green suite. This is the same class of failure
# as documentation pointing at a file that does not exist: a check that
# does not run looks exactly like a check that passed.
[pytest]
testpaths = tests
python_files = *.py
